[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telescope_llm_text_detection"
version = "1.0"
description = "Improving Zero-Shot Detection of LLM-Generated Content With Token Repetition"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "CC-BY-NC-SA-4.0"}
authors = [
    {name = "Christopher Nassif"},
    {name = "Josh Cooper"}
]
dependencies = [
    "torch",
    "transformers>=4.44.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "accelerate>=1.1.1"
]

[tool.setuptools]
packages = ["telescope_llm_text_detection"]
package-dir = {"telescope_llm_text_detection" = "llm_text_detectors"}
