[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telescope"
version = "0.1.0"
description = "Improving Zero-Shot Detection of LLM-Generated Content With Token Repetition"
requires-python = ">=3.9"
license = {text = "CC-BY-NC-SA-4.0"}
dependencies = [
    "torch",
    "transformers>=4.44.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
]

[tool.setuptools.packages.find]
include = ["src*"]
